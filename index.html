<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stillr</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="panel">
      <header class="brand">
        <h1>stillr <span class="version">ver1.2.1</span></h1>
        <p>Quiet 9:16 reels</p>
      </header>

      <section class="block">
        <h2>Media <span id="count" class="count">0 / 5</span></h2>
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*,video/*,.mov,audio/*,.wav,.aif,.aiff,.mp3" multiple hidden>
          <span>Drop materials here<br><small>Up to 5 photos or videos and 1 audio file (WAV, MP3 or AIFF). Or click to choose.</small></span>
        </label>
        <ol class="media-list" id="list"></ol>
      </section>

      <section class="block">
        <h2>Length</h2>
        <div class="segmented full">
          <label><input type="radio" name="duration" value="10"><span>10s</span></label>
          <label><input type="radio" name="duration" value="20"><span>20s</span></label>
          <label><input type="radio" name="duration" value="30"><span>30s</span></label>
          <label><input type="radio" name="duration" value="60"><span>1 min</span></label>
        </div>
      </section>

      <section class="block">
        <h2>Soundtrack</h2>
        <p class="hint" id="audio-empty">No soundtrack yet. Drop an audio file into Media above.</p>
        <div class="audio-item" id="audio" hidden>
          <div class="media-info">
            <span class="media-name" id="audio-name"></span>
            <span class="media-kind" id="audio-length"></span>
          </div>
          <div class="media-actions">
            <button type="button" id="audio-remove" aria-label="Remove">×</button>
          </div>
        </div>
        <div class="fades" id="fades" hidden>
          <label class="fade-toggle">
            <input type="checkbox" id="fade-in">
            <span><svg width="28" height="14" viewBox="0 0 28 14" aria-hidden="true"><path d="M1 13 L13 1 H27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Fade in</span>
          </label>
          <label class="fade-toggle">
            <input type="checkbox" id="fade-out" checked>
            <span><svg width="28" height="14" viewBox="0 0 28 14" aria-hidden="true"><path d="M1 1 H15 L27 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Fade out</span>
          </label>
        </div>
      </section>

      <section class="block">
        <h2>Mood</h2>
        <div class="segmented wrap" id="mood"></div>
      </section>

      <section class="block">
        <h2>Adjust</h2>
        <label class="slider"><span>Blur</span><input type="range" data-key="abstract" min="0" max="100" value="15"><output></output></label>
        <label class="slider"><span>Motion</span><input type="range" data-key="motion" min="0" max="100" value="50"><output></output></label>
        <label class="slider"><span>Film wear</span><input type="range" data-key="scratch" min="0" max="100" value="30"><output></output></label>
        <label class="slider"><span>Particles</span><input type="range" data-key="dust" min="0" max="100" value="35"><output></output></label>
        <label class="slider"><span>Speed</span><input type="range" data-key="speed" min="0" max="100" value="33"><output></output></label>
        <button type="button" id="shuffle" class="btn ghost">Reframe</button>
      </section>

      <section class="block">
        <button type="button" id="export" class="btn primary" disabled>Export</button>
        <div class="progress" id="progress" hidden>
          <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
          <span class="progress-label" id="progress-label"></span>
        </div>
        <p class="status" id="status"></p>
        <a id="download" class="btn" hidden>Save</a>
      </section>
    </aside>

    <main class="stage-wrap">
      <div class="stage">
        <canvas id="stage"></canvas>
        <p class="empty" id="empty">Add media to<br>see the preview here</p>
      </div>
      <div class="transport">
        <button type="button" id="play" class="btn">Play</button>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Playback position">
        <span id="time" class="time">0:00 / 0:20</span>
      </div>
    </main>
  </div>

  <div id="videos" class="video-pool" aria-hidden="true"></div>

  <script src="assets/js/renderer.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</body>
</html>
